name: Manuscript and evidence checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_source_coefficient_majorants.py
      - run: python scripts/check_publication.py
      - run: python scripts/test_figshare_upload.py
      - run: python scripts/test_figshare_release.py
      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended lmodern
      - run: python scripts/build.py
